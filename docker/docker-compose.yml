name: temp_monitor
services:
  zigbee2mqtt:
    image: ghcr.io/koenkk/zigbee2mqtt:2.14.3
    container_name: zigbee2mqtt
    ports:
      - "8081:8080"
    devices:
      - ${DONGLE_PATH}:/dev/ttyACM0
    volumes:
      - zigbee2mqtt-data:/app/data
      - ./zigbee2mqtt/configuration.yml:/app/data/configuration.yaml:rw
      - /run/udev:/run/udev:ro
    restart: unless-stopped
    environment:
      - TZ=Europe/Warsaw
  # mqtt5 eclipse-mosquitto
  mqtt5:
    image: eclipse-mosquitto:2.1.4-alpine
    container_name: mqtt5
    ports:
      - "1883:1883" #default mqtt port
      - "9001:9001" #default mqtt port for websockets
    volumes:
      - mqtt5-config:/mosquitto/config:rw
      - mqtt5-data:/mosquitto/data:rw
      - mqtt5-log:/mosquitto/log:rw
      - ./mqtt5/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    pre_start:
      - command: sh -c 'touch /mosquitto/config/pwfile && chmod 0700 /mosquitto/config/pwfile'
        user: mosquitto
  postgres:
    image: postgres:19.0-alpine
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: temp-monitor
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
      POSTGRES_GRAFANA_PASSWORD: ${POSTGRES_GRAFANA_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh:ro

# volumes for mapping data,config and log
volumes:
  mqtt5-config:
  mqtt5-data:
  mqtt5-log:
  zigbee2mqtt-data:
  postgres-data:

networks:
  default:
    name: mqtt5-network